# Builds the example firmware for a real ESP32 with Espressif's ESP-IDF, unchanged from the sources the simulator runs
# (LFSim Lab Phase 2: the same C code is simulated and flashed). Separate from the website deploy.
name: ESP32 firmware build
on:
  push:
    paths: ['lab/firmware/**', '.github/workflows/esp32.yml']
  pull_request:
    paths: ['lab/firmware/**', '.github/workflows/esp32.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [rmi-test-rig, reference, maze]
    steps:
      - uses: actions/checkout@v4
      - name: Build lab/firmware/examples/${{ matrix.project }} for ESP32 (ESP-IDF v5.2)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2.2
          target: esp32
          path: lab/firmware/examples/${{ matrix.project }}
